<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' ws: wss: http://localhost:8080 http://127.0.0.1:8080;"
    />
    <title>Mini Guild Idle</title>
    <!-- PWA: instalável e offline no celular/navegador (ignorado no Electron). -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" content="#10151e" />
    <link rel="icon" type="image/png" href="./icon-256.png" />
    <link rel="apple-touch-icon" href="./icon-256.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <!-- iOS PWA splash screens -->
    <link rel="apple-touch-startup-image" media="screen and (device-width: 320px) and (device-height: 568px) and (-webkit-device-pixel-ratio: 2)" href="./splash/splash-iphone-se.png" />
    <link rel="apple-touch-startup-image" media="screen and (device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2)" href="./splash/splash-iphone-6-7-8.png" />
    <link rel="apple-touch-startup-image" media="screen and (device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3)" href="./splash/splash-iphone-x.png" />
    <link rel="apple-touch-startup-image" media="screen and (device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 3)" href="./splash/splash-iphone-xs-max.png" />
    <link rel="apple-touch-startup-image" media="screen and (device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3)" href="./splash/splash-iphone-12-13.png" />
    <link rel="apple-touch-startup-image" media="screen and (device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3)" href="./splash/splash-iphone-12-13-pro-max.png" />
    <link rel="apple-touch-startup-image" media="screen and (device-width: 768px) and (device-height: 1024px) and (-webkit-device-pixel-ratio: 2)" href="./splash/splash-ipad.png" />
    <link rel="apple-touch-startup-image" media="screen and (device-width: 1024px) and (device-height: 1366px) and (-webkit-device-pixel-ratio: 2)" href="./splash/splash-ipad-pro.png" />
    <script type="module" crossorigin src="./assets/index-ms2BrWUT.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/i18n-BsuRIRqR.js">
    <link rel="stylesheet" crossorigin href="./assets/index-DjqFFf7u.css">
  </head>
  <body class="mode-expanded">
    <div id="boot-loading" role="status" aria-live="polite" style="background-image:url('./splash/splash.png')">
      <div class="boot-loading-shade"></div>
      <div class="boot-loading-panel">
        <span class="boot-loading-kicker">MINI GUILD IDLE</span>
        <b id="boot-loading-status">Abrindo os portões da guilda…</b>
        <div class="boot-loading-track"><i></i></div>
        <small id="boot-loading-note">Preparando sua próxima expedição</small>
      </div>
    </div>
    <div id="app-row">
    <div id="app">
      <div id="log-ticker" title="Clique para expandir/recolher o histórico">-</div>
      <section id="combat">
        <canvas id="combat-canvas"></canvas>
         <button id="btn-toggle-farm" class="farm-toggle" title="Auto-repetir fase: Off" aria-label="Auto-repetir fase"></button>
         <button id="btn-toggle-mode" class="mode-toggle" title="Expandir"></button>
      </section>

      <section id="compact-hud" class="hud">
        <div class="hud-row">
          <span id="hud-stage">Fase 1-1 • 0/6</span>
          <span id="hud-lastdrop" class="dim">-</span>
        </div>
      </section>

      <section id="expanded-panel">
        <!--
          Menu por INTENÇÃO, não por sistema. A ordem destes botões é fixa e
          nunca se reorganiza durante o save: desbloqueio só revela um grupo
          que já tinha lugar reservado (ver src/ui/navigation.ts). Cada grupo
          abre uma faixa de sub-vistas dentro do próprio conteúdo.
        -->
        <nav id="tabs">
          <button class="tab active" data-group="base" title="Mochila, baú e equipamento"><i><img class="tab-rune-icon" src="./assets/sprites/ui/navigation/nav-home.png?v=20260809" alt=""></i><span>Início</span></button>
          <button class="tab" data-group="combate" title="Mapa, dificuldades, bestiário e o modo Aventura"><i><img class="tab-rune-icon" src="./assets/sprites/ui/navigation/nav-combat.png?v=20260809" alt=""></i><span>Combate</span></button>
          <button class="tab" data-group="herois" title="Atributos, skills, pets e o legado das linhagens"><i><img class="tab-rune-icon" src="./assets/sprites/ui/navigation/nav-heroes.png?v=20260809" alt=""></i><span>Heróis</span></button>
          <button class="tab" data-group="coleta" title="Tudo que está pronto para resgatar, num lugar só"><i><img class="tab-rune-icon" src="./assets/sprites/ui/navigation/nav-collect.png?v=20260809" alt=""></i><span>Coleta</span></button>
          <button class="tab" data-group="progressao" title="Bônus permanentes de conta: runas e coleção"><i><img class="tab-rune-icon" src="./assets/sprites/ui/navigation/nav-progress.png?v=20260809" alt=""></i><span>Progressão</span></button>
          <button class="tab" data-group="vila" title="Postos de trabalho, guilda e a sede construível"><i><img class="tab-rune-icon" src="./assets/sprites/ui/navigation/nav-village.png?v=20260809" alt=""></i><span>Vila</span></button>
          <button class="tab" data-group="cubo" title="Síntese, forja, sockets e encantamento"><i><img class="tab-rune-icon" src="./assets/sprites/ui/navigation/nav-cube.png?v=20260809" alt=""></i><span>Cubo</span></button>
          <button class="tab" data-group="mais" title="Grimório e configurações"><i><img class="tab-rune-icon" src="./assets/sprites/ui/navigation/nav-more.png?v=20260809" alt=""></i><span>Mais</span></button>
        </nav>
        <div id="tab-content"></div>
      </section>
    </div>
    </div>

    <!-- Modal genérico (offline / confirmações) -->
    <div id="modal-overlay" class="hidden">
      <div id="modal-box">
        <div id="modal-content"></div>
      </div>
    </div>

  </body>
</html>
